[project]
name = "pulse-demo"
version = "0.1.0"
description = "A synthetic, real-time monitoring demo for code-server"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "websocket-client>=1.8,<2", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
